# ==================== mse-data 专属配置（Data ID: mse-data.yaml    Group: DEFAULT_GROUP） ====================
# 本文件是服务 application.yaml 的本地留档：经 init-configs.sh 写入 Nacos 后由配置中心管理，
# 共享项（数据源/Redis/Sa-Token/MyBatis-Plus/Dubbo/租户开关）见 mse-micro-common/db/dubbo.yaml。
server:
  port: 8093

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,slowsql

spring:
  datasource:
    dynamic:
      # Seata 已随 micro-starter 内置、默认关停（MSE_SEATA_ENABLED=false）：显式关闭数据源 Seata 代理开关
      # （启用全局事务：置 MSE_SEATA_ENABLED=true 后删除本行即可恢复 true）
      seata: false

mse:
  data:
    # 敏感字段（数据源口令/appSecret）AES-GCM 落库加密密钥，
    # 生产必须修改并妥善保管；更换密钥后历史密文无法解密，需重新录入凭据
    crypt-key: ${MSE_DATA_CRYPT_KEY:mse-data-default-crypt-key-please-change}
    # 注册数据源的连接池：单池最大连接数 / 闲置回收秒数
    pool:
      max-pool-size: 8
      idle-timeout-seconds: 300
    # 同步引擎：单批拉取行数 / 并发执行线程数
    sync:
      batch-size: 2000
      executor-parallelism: 2
    # 开放 API 默认防护：单 app 每分钟最大调用次数（dat_api.qps_limit 可按 API 覆盖）
    open:
      signature-timeout-seconds: 300

# ==================== 信创数据库切换 ====================
# 达梦/金仓的数据源与方言由共享 mse-micro-db.yaml 的 dm/kingbase profile 提供，
# 启动加 --spring.profiles.active=dm 或 kingbase 即切换，本文件无需重复配置。
