# ==================== mse-im · OpenIM 实例（租户 PoC，单机单套） ====================
# 基于 openimsdk/openim-docker 裁剪：去掉 openim-chat（账号层由 ai-mse 承担，见
# docs/tech/openim-integration.md）、web/admin 前端与 prometheus/grafana/alertmanager/node-exporter；
# 容器名/网络内主机名统一加 im- 前缀，避免与基座 docker-compose（mse-framework/docker）撞名。
# 启动：docker compose up -d   健康检查：docker exec im-openim-server mage check
# 端口核对表见同目录 README.md；secret 与 mse 侧 mse.im.server.secret 必须一致。
networks:
  openim:
    driver: bridge

services:
  im-mongo:
    image: "${MONGO_IMAGE}"
    container_name: im-mongo
    command: >
      bash -c '
      docker-entrypoint.sh mongod --wiredTigerCacheSizeGB $$wiredTigerCacheSizeGB --auth &
      until mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval "db.runCommand({ ping: 1 })" &>/dev/null; do
        echo "Waiting for MongoDB to start..."
        sleep 1
      done &&
      mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval "
      db = db.getSiblingDB(\"$$MONGO_INITDB_DATABASE\");
      if (!db.getUser(\"$$MONGO_OPENIM_USERNAME\")) {
        db.createUser({
          user: \"$$MONGO_OPENIM_USERNAME\",
          pwd: \"$$MONGO_OPENIM_PASSWORD\",
          roles: [{role: \"readWrite\", db: \"$$MONGO_INITDB_DATABASE\"}]
        });
        print(\"User created successfully\");
      } else {
        print(\"User already exists\");
      }
      " &&
      tail -f /dev/null
      '
    volumes:
      - "${DATA_DIR}/components/mongodb/data/db:/data/db"
      - "${DATA_DIR}/components/mongodb/data/logs:/data/logs"
      - "${DATA_DIR}/components/mongodb/data/conf:/etc/mongo"
    environment:
      - TZ=Asia/Shanghai
      - wiredTigerCacheSizeGB=1
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=openIM123
      - MONGO_INITDB_DATABASE=openim_v3
      - MONGO_OPENIM_USERNAME=${MONGO_USERNAME}
      - MONGO_OPENIM_PASSWORD=${MONGO_PASSWORD}
    restart: always
    networks:
      - openim

  im-redis:
    image: "${REDIS_IMAGE}"
    container_name: im-redis
    volumes:
      - "${DATA_DIR}/components/redis/data:/data"
    environment:
      TZ: Asia/Shanghai
    restart: always
    sysctls:
      net.core.somaxconn: 1024
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    networks:
      - openim

  im-etcd:
    image: "${ETCD_IMAGE}"
    container_name: im-etcd
    ports:
      - "12379:2379"
      - "12380:2380"
    environment:
      - ETCD_NAME=s1
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_CLUSTER=s1=http://0.0.0.0:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=tkn
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ALLOW_NONE_AUTHENTICATION=yes
    volumes:
      - "${DATA_DIR}/components/etcd:/etcd-data"
    command: >
      /bin/sh -c '
        etcd &
        export ETCDCTL_API=3
        until etcdctl --endpoints=http://127.0.0.1:2379 endpoint health &>/dev/null; do
          echo "Waiting for ETCD to start..."
          sleep 1
        done
        tail -f /dev/null
      '
    restart: always
    networks:
      - openim

  im-kafka:
    image: "${KAFKA_IMAGE}"
    container_name: im-kafka
    user: root
    restart: always
    volumes:
      - "${DATA_DIR}/components/kafka:/bitnami/kafka"
    environment:
      TZ: Asia/Shanghai
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@im-kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 9092 broker 内部 / 9093 controller / 9094 外部（openim-server 容器经 im-kafka:9094 访问）
      KAFKA_CFG_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://im-kafka:9092,EXTERNAL://im-kafka:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
    networks:
      - openim

  im-minio:
    image: "${MINIO_IMAGE}"
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9090"
    container_name: im-minio
    volumes:
      - "${DATA_DIR}/components/mnt/data:/data"
      - "${DATA_DIR}/components/mnt/config:/root/.minio"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY_ID}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_ACCESS_KEY}"
    restart: always
    command: minio server /data --console-address ':9090'
    networks:
      - openim

  # 音视频通话 RTC（1v1）：客户端信令走 OpenIM custom 在线消息，媒体进 LiveKit 房间。
  # key/secret 与 mse 侧 mse.im.livekit.api-key/api-secret 一致（token 由 mse-im 签发）。
  # 生产：信令经 wss 反代（LIVEKIT_PORT），UDP 段放通防火墙；Docker Desktop 取本机地址。
  im-livekit:
    image: "${LIVEKIT_IMAGE}"
    container_name: im-livekit
    command: >
      --bind 0.0.0.0
      --node-ip ${LIVEKIT_NODE_IP}
      --rtc-tcp-port 7881
      --rtc-port-range-start ${LIVEKIT_UDP_START}
      --rtc-port-range-end ${LIVEKIT_UDP_END}
      --keys ${LIVEKIT_API_KEY}:${LIVEKIT_API_SECRET}
    ports:
      - "${LIVEKIT_PORT}:7880"
      - "${LIVEKIT_RTC_TCP_PORT}:7881"
      - "${LIVEKIT_UDP_START}-${LIVEKIT_UDP_END}:${LIVEKIT_UDP_START}-${LIVEKIT_UDP_END}/udp"
    restart: always
    networks:
      - openim

  im-openim-server:
    image: ${OPENIM_SERVER_IMAGE}
    container_name: im-openim-server
    init: true
    volumes:
      # token 有效期覆盖（tokenPolicy.expire=7 天，.env 的 IMENV_TOKENPOLICY_EXPIRE 经实测不生效）：
      # 单文件挂载覆盖镜像内配置，其余配置仍以 IMENV_* 环境变量注入
      - "./config/openim-rpc-auth.yml:/openim-server/config/openim-rpc-auth.yml"
      # webhook 回调配置（url 指向 mse-im，启用机器人/停用踢线所需 after 事件；见同目录 README）
      - "./config/webhooks.yml:/openim-server/config/webhooks.yml"
    ports:
      - "${OPENIM_MSG_GATEWAY_PORT}:10001"
      - "${OPENIM_API_PORT}:10002"
    healthcheck:
      test: ["CMD", "sh", "-c", "mage check"]
      interval: 5s
      timeout: 60s
      retries: 10
    environment:
      - IMENV_MONGODB_ADDRESS=${MONGO_ADDRESS}
      - IMENV_MONGODB_USERNAME=${MONGO_USERNAME}
      - IMENV_MONGODB_PASSWORD=${MONGO_PASSWORD}
      - IMENV_KAFKA_ADDRESS=${KAFKA_ADDRESS}
      - IMENV_DISCOVERY_ETCD_ADDRESS=${ETCD_ADDRESS}
      - IMENV_REDIS_ADDRESS=${REDIS_ADDRESS}
      - IMENV_REDIS_PASSWORD=${REDIS_PASSWORD}
      - IMENV_MINIO_INTERNALADDRESS=${MINIO_INTERNAL_ADDRESS}
      - IMENV_MINIO_EXTERNALADDRESS=${MINIO_EXTERNAL_ADDRESS}
      - IMENV_MINIO_ACCESSKEYID=${MINIO_ACCESS_KEY_ID}
      - IMENV_MINIO_SECRETACCESSKEY=${MINIO_SECRET_ACCESS_KEY}
      # share.yml 顶层 secret：与 mse 侧 mse.im.server.secret 一致
      - IMENV_SHARE_SECRET=${OPENIM_SECRET}
      - IMENV_LOG_ISSTDOUT=${LOG_IS_STDOUT}
      - IMENV_LOG_REMAINLOGLEVEL=${LOG_LEVEL}
    restart: always
    depends_on:
      - im-mongo
      - im-redis
      - im-etcd
      - im-kafka
      - im-minio
    networks:
      - openim
